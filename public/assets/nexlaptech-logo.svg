<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">Nex LapTech</title>
  <desc id="desc">Nex LapTech round badge logo with glowing cyan ring and laptop branding</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#0a275d"/>
      <stop offset="0.45" stop-color="#031932"/>
      <stop offset="1" stop-color="#010b18"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19d3ff"/>
      <stop offset="0.5" stop-color="#1e6bff"/>
      <stop offset="1" stop-color="#21d0ff"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#dfefff"/>
      <stop offset="0.7" stop-color="#9ae1ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="384" cy="384" r="355" fill="#f5f7fa"/>
